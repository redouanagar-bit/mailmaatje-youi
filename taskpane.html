<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailmaatje</title>
<script>
// Cache omzeilen: GitHub Pages cachet 10 min. Herlaad zichzelf met uniek nummer, behalve in de
// aanmelddialoog en bij terugkeer van Microsoft (hash met code).
(function () {
  try {
    if (/[?&](v|dialog)=/.test(location.search) || /(code|error|state)=/.test(location.hash) || sessionStorage.getItem("mn_dialog") === "1") return;
    location.replace(location.pathname + "?v=" + Date.now());
  } catch (e) {}
})();
</script>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root { --fg:#242424; --muted:#616161; --line:#e0e0e0; --bg:#ffffff; --soft:#f5f5f5; --hover:#ebebeb;
          --accent:#0f6cbd; --accent-hover:#115ea3; --danger:#c50f1f; --r:6px; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; padding:14px 14px 20px; font:13px/1.45 "Segoe UI", "Segoe UI Web", system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  h1 { font-size:15px; font-weight:600; margin:0 0 2px; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 6px; }
  label:first-of-type { margin-top:12px; }

  /* Categorieën: 3 x 3, pil-vormige knoppen met kleurstip */
  .cats { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .cats button { font:inherit; font-size:12px; padding:7px 6px 7px 18px; border:1px solid var(--line); border-radius:var(--r);
    background:var(--bg); color:var(--fg); cursor:pointer; position:relative; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    min-height:32px; transition:background .12s, border-color .12s, box-shadow .12s; }
  .cats button:hover { background:var(--soft); border-color:#c7c7c7; }
  .cats button::before { content:""; position:absolute; left:7px; top:50%; width:7px; height:7px; margin-top:-4px; border-radius:50%; background:var(--c, #999); }
  .cats button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .cats button.on::before { box-shadow:0 0 0 2px rgba(255,255,255,.35); }
  .cats button:disabled { opacity:.6; cursor:default; }
  .cats .slot { border:1px dashed var(--line); border-radius:var(--r); background:var(--soft); min-height:32px; }

  input, textarea, select { width:100%; font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:var(--r); background:var(--bg); color:var(--fg);
    transition:border-color .12s, box-shadow .12s; }
  input:hover, textarea:hover { border-color:#c7c7c7; }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(15,108,189,.18); }
  textarea { min-height:72px; resize:vertical; }
  ::placeholder { color:#8a8a8a; }
  .row { display:flex; gap:6px; align-items:center; }
  .row input { flex:1; }
  .row input[type=time] { flex:0 0 96px; }

  .btn { font:inherit; font-weight:600; padding:7px 12px; border:1px solid var(--accent); border-radius:var(--r); background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap;
    transition:background .12s, border-color .12s; }
  .btn:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  .btn.lite { background:var(--bg); color:var(--fg); border-color:var(--line); font-weight:500; }
  .btn.lite:hover { background:var(--soft); border-color:#c7c7c7; }
  .btn[disabled] { opacity:.5; cursor:default; }

  .warn { font-size:12px; margin-top:6px; font-weight:600; color:var(--danger); }
  .warn:empty { display:none; }

  details { border:1px solid var(--line); border-radius:var(--r); padding:6px 10px; margin-top:8px; background:var(--soft); }
  details[open] { background:var(--bg); }
  summary { cursor:pointer; font-size:12px; font-weight:500; color:var(--fg); list-style:none; display:flex; align-items:center; gap:6px; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:""; width:6px; height:6px; border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted); transform:rotate(-45deg); transition:transform .12s; }
  details[open] summary::before { transform:rotate(45deg); }
  .rem { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; margin:8px 0 4px; }
  .rem label { display:flex; align-items:center; gap:6px; text-transform:none; letter-spacing:0; font-size:12px; font-weight:400; color:var(--fg); margin:0; }
  .rem input { width:auto; accent-color:var(--accent); }

  .note { border-top:1px solid var(--line); padding:9px 0; }
  .note:first-child { border-top:0; padding-top:4px; }
  .note .meta { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; }
  .note .meta a { color:var(--muted); cursor:pointer; text-decoration:none; }
  .note .meta a:hover { color:var(--danger); text-decoration:underline; }
  .note .txt { white-space:pre-wrap; margin-top:3px; }
  .hist { display:flex; gap:8px; font-size:12px; padding:5px 0; border-top:1px solid var(--line); }
  .hist:first-child { border-top:0; }
  .hist .d { color:var(--muted); white-space:nowrap; flex:0 0 auto; }
  .hist .x { flex:1; }


  .rel { border-top:1px solid var(--line); padding:7px 8px; margin:0 -8px; border-radius:var(--r); cursor:pointer; }
  .rel:hover { background:var(--soft); }
  .rel .m { font-size:11px; color:var(--muted); }
  .rel .s { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grp { font-size:11px; font-weight:600; color:var(--muted); margin:8px 0 2px; }
  .overlay { position:fixed; inset:0; background:var(--bg); padding:14px; overflow:auto; z-index:10; }
  .sug { border:1px solid var(--line); border-radius:var(--r); padding:8px 10px; margin-bottom:6px; background:var(--soft); display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; }
  .ck { border-top:1px solid var(--line); padding:6px 8px; margin:0 -8px; border-radius:var(--r); cursor:pointer; }
  .ck:hover { background:var(--soft); }
  .ck .m { font-size:11px; color:var(--muted); }
  .ck .s { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ck .late { color:var(--danger); font-weight:600; }
  .ckp.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .pr { font-size:10px; font-weight:600; padding:1px 6px; border-radius:10px; border:1px solid var(--line); margin-left:6px; vertical-align:middle; }
  .pr.hoog { color:var(--danger); border-color:var(--danger); }
  .pr.laag { color:var(--muted); }
  .pr.afgehandeld { color:#107c10; border-color:#107c10; }
  .dl { border-top:1px solid var(--line); padding:7px 0; }
  .dl .meta { font-size:11px; color:var(--muted); }
  .dl .txt { white-space:pre-wrap; margin-top:2px; }
  .dl.sys .txt { color:var(--muted); font-size:12px; font-style:italic; }
  .ovhead { display:flex; justify-content:space-between; align-items:center; }
  .ovrow { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-top:1px solid var(--line); }
  .ovrow input { width:auto; margin-top:3px; accent-color:var(--accent); }
  .ovrow .b { flex:1; min-width:0; }
  .ovrow .s { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ovrow .m, .ovrow .c { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dos { border-top:1px solid var(--line); padding:6px 8px; margin:0 -8px; border-radius:var(--r); cursor:pointer; }
  .dos:hover { background:var(--soft); }
  .dos .m { font-size:11px; color:var(--muted); }
  .dos .s { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .top { padding-bottom:10px; border-bottom:1px solid var(--line); }
  .top details { margin-top:6px; }
  #filterList { margin-top:4px; max-height:260px; overflow:auto; }
  #filterList .rel .c { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .foot { margin-top:14px; font-size:11px; color:var(--muted); }
  #msg { font-size:12px; color:var(--muted); min-height:16px; margin-top:8px; }
  .empty { color:var(--muted); font-size:12px; }
  #auth { margin-top:10px; padding:10px; border:1px solid var(--line); border-radius:var(--r); background:var(--soft); }
  #auth .btn { width:100%; }
  #auth .foot { margin-top:6px; }
</style>
</head>
<body>
  <div id="app" hidden>
    <div class="top">
      <div class="row" style="justify-content:space-between">
        <h1>Mailmaatje</h1>
        <button class="btn lite" id="ckBtn">Overzicht</button>
      </div>
      <details id="filterBox">
        <summary>Filter mailbox (<span id="filterCount">0</span> gekozen)</summary>
        <div class="rem" id="filterCats"></div>
        <div class="row" style="margin-top:6px;justify-content:space-between">
          <span class="foot" id="filterState" style="margin:0"></span>
          <button class="btn lite" id="filterClear">Wis filter</button>
        </div>
      </details>
      <div id="filterList"></div>
    </div>

    <label>Deze mail</label>
    <div class="sub" id="subject"></div>

    <label>Categorieën</label>
    <div class="cats" id="cats"></div>
    <div class="empty" id="catsMsg" hidden></div>

    <label for="deadline">Deadline</label>
    <div class="row">
      <input type="date" id="deadline">
      <input type="time" id="dtime" value="09:00">
    </div>
    <details id="remBox" style="margin-top:6px">
      <summary>Herinneringen (<span id="remCount">0</span> gekozen)</summary>
      <div class="rem" id="rem"></div>
    </details>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="saveDeadline">Opslaan</button>
      <button class="btn lite" id="clearDeadline">Wis deadline</button>
    </div>
    <div class="warn" id="overdue"></div>
    <div class="foot" id="flagState" style="margin-top:4px"></div>
    <div class="foot" id="calState" style="margin-top:2px"></div>

    <label for="owner">Verantwoordelijke</label>
    <input id="owner" list="ownerList" placeholder="Naam">
    <datalist id="ownerList"></datalist>

    <label for="newNote">Notitie toevoegen</label>
    <textarea id="newNote" placeholder="Typ een notitie…"></textarea>
    <div class="row" style="margin-top:6px" id="noteTargetRow" hidden>
      <span class="foot" style="margin:0">Opslaan in</span>
      <select id="noteTarget" style="flex:1"></select>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:6px">
      <span class="foot" id="space" style="margin:0"></span>
      <button class="btn" id="addNote">Toevoegen</button>
    </div>

    <div id="dlogBox" hidden>
      <div class="row" style="justify-content:space-between;margin-top:14px">
        <label style="margin:0">Dossier — <span id="dlogName"></span></label>
        <select id="dlogPrio" style="width:auto">
          <option value="laag">Prio: Laag</option>
          <option value="middel">Prio: Middel</option>
          <option value="hoog">Prio: Hoog</option>
          <option value="afgehandeld">Afgehandeld</option>
        </select>
      </div>
      <div id="dlog"></div>
    </div>

    <label id="notesLabel">Notities</label>
    <div id="notes"></div>

    <details id="histBox" style="margin-top:12px">
      <summary>Statushistorie (<span id="histCount">0</span>)</summary>
      <div id="hist"></div>
    </details>

    <label>Dossier</label>
    <div id="dossier" class="empty">—</div>
    <div class="row" style="margin-top:6px">
      <button class="btn lite" id="dossierBtn">Dossier samenstellen</button>
    </div>

    <label>Gerelateerde mails</label>
    <div id="related" class="empty">—</div>

    <div id="msg"></div>
    <div id="auth" hidden>
      <button class="btn lite" id="signIn">Aanmelden voor agenda en gerelateerde mails</button>
      <div class="foot" id="authMsg"></div>
    </div>
    <div class="foot">Alleen zichtbaar in deze mailbox. Wordt niet meegestuurd bij beantwoorden of doorsturen.</div>
  </div>
  <div id="none" class="empty" hidden>Selecteer een e-mail, of open het <a href="#" id="noneCk">overzicht</a>.</div>

  <!-- Overlay: cockpit / overzicht -->
  <div id="ck" class="overlay" hidden>
    <div class="ovhead">
      <strong>Overzicht</strong>
      <div class="row">
        <button class="btn lite" id="ckSweep" title="Mails met een verzonden antwoord op Beantwoord zetten">Automatisch bijwerken</button>
        <button class="btn lite" id="ckClose">Sluiten</button>
      </div>
    </div>
    <div class="foot" id="ckState" style="margin-top:6px"></div>
    <label>Deadlines (vlaggen)</label>
    <div id="ckDead" class="empty">—</div>
    <label>Blijven liggen (<span id="ckStaleName">niet gelezen</span>, ouder dan 2 dagen)</label>
    <div id="ckStale" class="empty">—</div>
    <label>Dossiers</label>
    <div class="row" style="margin-bottom:6px">
      <button class="btn lite ckp on" data-p="alle">Alle</button>
      <button class="btn lite ckp" data-p="hoog">Hoog</button>
      <button class="btn lite ckp" data-p="middel">Middel</button>
      <button class="btn lite ckp" data-p="laag">Laag</button>
      <button class="btn lite ckp" data-p="afgehandeld">Afgehandeld</button>
    </div>
    <div id="ckDos" class="empty">—</div>
  </div>

  <!-- Overlay: dossier samenstellen -->
  <div id="ov" class="overlay" hidden>
    <div class="ovhead">
      <strong>Dossier samenstellen</strong>
      <button class="btn lite" id="ovClose">Sluiten</button>
    </div>
    <label for="ovName" style="margin-top:8px">Dossiernaam</label>
    <input id="ovName" list="ovNames" placeholder="Bijv. Zorgbureau facturen">
    <datalist id="ovNames"></datalist>
    <label for="ovSearch">Zoeken in mailbox</label>
    <div class="row">
      <input id="ovSearch" placeholder="Afzender, onderwerp of trefwoord">
      <button class="btn lite" id="ovSearchBtn">Zoek</button>
    </div>
    <div class="foot" id="ovState" style="margin-top:6px"></div>
    <div id="ovList"></div>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <span class="foot" id="ovCount" style="margin:0">0 gekozen</span>
      <button class="btn" id="ovSave">Opslaan</button>
    </div>
  </div>

<script>
(function () {
  "use strict";
  // --- Instellingen -------------------------------------------------------
  var KEY = "mn";            // naam van de custom property op de mail
  var CATEGORY = "Mailnotitie";
  var LIMIT = 2400;          // Outlook staat ca. 2500 tekens aan custom properties per mail toe
  var MAXCATS = 9;           // 3 x 3
  var CLIENT_ID = "763ff77f-6e71-43db-8799-3982a11a1e2d";   // app-registratie Mailmaatje (YOUI Advies)
  var TENANT_ID = "85226cd3-dd88-4380-bc4f-b502c937d79f";
  var SCOPES = ["User.Read", "Calendars.ReadWrite", "Mail.ReadWrite"];
  var GRAPH = "https://graph.microsoft.com/v1.0";
  var EXTPROP = "String {66f5a359-4659-4830-9070-00050ec6ac6e} Name MailnotitieRef";  // koppelt agenda-items aan de mail
  var REMINDERS = [
    [10, "10 minuten"], [30, "30 minuten"], [60, "1 uur"], [180, "3 uur"], [360, "6 uur"], [720, "12 uur"],
    [1440, "1 dag"], [2880, "2 dagen"], [4320, "3 dagen"], [5760, "4 dagen"],
    [10080, "1 week"], [20160, "2 weken"], [43200, "1 maand"]
  ];
  // Outlook-presetkleuren (Preset0..Preset24) naar hex, alleen voor het bolletje voor de naam.
  var COLORS = ["#e74856","#ff8c00","#a0522d","#ffd700","#107c10","#008272","#808000","#0078d4","#8764b8","#c239b3","#4f6bed","#3a3f5c","#808080","#505050","#000000","#a4262c","#ca5010","#5c2e0e","#986f0b","#0b6a0b","#005b5b","#498205","#004e8c","#5c2d91","#881798"];

  var props = null, data = null, me = "", master = [], current = [], allCats = [];
  var DOSSIER_PREFIX = "Dossier: ";
  var LOGFOLDER = "Mailmaatje";          // map in de mailbox met één item per dossier (het dossierlogboek)
  var dlog = null;                       // { name, id, entries: [...] } van het huidige dossier
  var logFolderId = null;
  function findCat(re) { var c = allCats.filter(function (c) { return re.test(c.displayName); })[0]; return c ? c.displayName : ""; }
  function staleCat() { return findCat(/niet gelezen|niet aan begonnen|nog niet behandeld/i); }
  function answeredCat() { return findCat(/^beantwoord$/i) || findCat(/beantwoord/i); }
  function isDossierCat(n) { return typeof n === "string" && n.indexOf(DOSSIER_PREFIX) === 0; }
  var pca = null, account = null, graphMsg = null, loadSeq = 0;

  function $(id) { return document.getElementById(id); }
  function empty() { return { d: "", t: "", r: [], v: "", n: [] }; }
  function msg(t) { $("msg").textContent = t || ""; }
  function hasContent(d) { return !!(d.d || d.v || d.n.length); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtDate(iso) {
    var x = new Date(iso);
    return pad(x.getDate()) + "-" + pad(x.getMonth() + 1) + "-" + x.getFullYear() + " " + pad(x.getHours()) + ":" + pad(x.getMinutes());
  }
  function fmtD(ymd) { var p = ymd.split("-"); return p[2] + "-" + p[1] + "-" + p[0]; }
  function remLabel(m) { for (var i = 0; i < REMINDERS.length; i++) if (REMINDERS[i][0] === m) return REMINDERS[i][1]; return m + " min"; }
  function addSys(text) {
    data.n.push({ t: new Date().toISOString(), a: me, x: text, k: "s" });
    if (dlog) dlogAppend({ t: new Date().toISOString(), a: me, x: text, k: "s", subj: (graphMsg && graphMsg.subject) || "" });
  }

  // --- Laden van de mail --------------------------------------------------
  function load() {
    var item = Office.context.mailbox.item, seq = ++loadSeq;
    if (!item) { $("app").hidden = true; $("none").hidden = false; openCockpit(); return; }
    $("none").hidden = true; $("app").hidden = false;
    $("subject").textContent = item.subject || "(geen onderwerp)";
    $("newNote").value = "";
    $("related").textContent = "—"; $("dossier").textContent = "—"; $("flagState").textContent = ""; lastRelated = []; dlog = null; $("dlogBox").hidden = true; $("noteTargetRow").hidden = true; $("calState").textContent = ""; graphMsg = null;
    msg("Laden…");
    item.loadCustomPropertiesAsync(function (r) {
      if (seq !== loadSeq) return;
      if (r.status !== Office.AsyncResultStatus.Succeeded) { msg("Kon notities niet laden: " + r.error.message); return; }
      props = r.value;
      try { data = JSON.parse(props.get(KEY) || "null") || empty(); } catch (e) { data = empty(); }
      if (!Array.isArray(data.n)) data.n = [];
      if (!Array.isArray(data.r)) data.r = [];
      render(); msg("");
      graphRefresh(seq);
    });
    loadCats();
  }

  function render() {
    $("deadline").value = data.d || "";
    $("dtime").value = data.t || "09:00";
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var late = data.d && new Date(data.d + "T00:00:00") < today;
    $("overdue").textContent = late ? "Deadline verstreken" : "";
    $("owner").value = data.v || "";
    renderReminders();
    var box = $("notes"); box.innerHTML = "";
    var notes = data.n.filter(function (n) { return n.k !== "s"; }), sys = data.n.filter(function (n) { return n.k === "s"; });
    // Statushistorie (categorie, vlag, agenda) in eigen blok
    var hb = $("hist"); hb.innerHTML = ""; $("histCount").textContent = sys.length;
    if (!sys.length) hb.innerHTML = '<div class="empty">Nog geen wijzigingen.</div>';
    sys.slice().reverse().forEach(function (n) {
      var el = document.createElement("div"); el.className = "hist";
      var d = document.createElement("span"); d.className = "d"; d.textContent = fmtDate(n.t);
      // Naam erbij; regels zijn niet te verwijderen (verantwoording wie wat heeft gewijzigd).
      var x = document.createElement("span"); x.className = "x"; x.textContent = n.x + " — " + (n.a || "onbekend");
      el.appendChild(d); el.appendChild(x); hb.appendChild(el);
    });
    if (!notes.length) { box.innerHTML = '<div class="empty">Nog geen notities.</div>'; }
    notes.slice().reverse().forEach(function (n) {
      var real = data.n.indexOf(n);
      var el = document.createElement("div"); el.className = "note";
      var meta = document.createElement("div"); meta.className = "meta";
      var who = document.createElement("span"); who.textContent = fmtDate(n.t) + " · " + n.a;
      // Geen confirm(): Outlook blokkeert browserpop-ups in add-ins. Bevestiging in het paneel zelf.
      var del = document.createElement("a"); del.textContent = "verwijder";
      var ask = document.createElement("span"); ask.hidden = true;
      var yes = document.createElement("a"); yes.textContent = "verwijderen";
      var no = document.createElement("a"); no.textContent = "annuleren"; no.style.marginLeft = "8px";
      ask.appendChild(document.createTextNode("Zeker? ")); ask.appendChild(yes); ask.appendChild(no);
      del.onclick = function () { del.hidden = true; ask.hidden = false; };
      no.onclick = function () { ask.hidden = true; del.hidden = false; };
      yes.onclick = function () { data.n.splice(real, 1); save("Notitie verwijderd"); };
      meta.appendChild(who); meta.appendChild(del); meta.appendChild(ask);
      var txt = document.createElement("div"); txt.className = "txt"; txt.textContent = n.x;
      el.appendChild(meta); el.appendChild(txt); box.appendChild(el);
    });
    $("space").textContent = "Ruimte: " + Math.max(0, LIMIT - JSON.stringify(data).length) + " tekens";
  }

  function renderReminders() {
    var box = $("rem"); box.innerHTML = "";
    REMINDERS.forEach(function (r) {
      var l = document.createElement("label");

        graphMsg = null; loadCats();
        return currentMessage(token).then(function (m) { return dossierList(token, m); });
      });
    }).catch(function (e) { $("ovState").textContent = "Opslaan mislukt: " + e.message; })
      .then(function () { $("ovSave").disabled = false; });
  }
  function addGroup(box, title, list) {
    var g = document.createElement("div"); g.className = "grp"; g.textContent = title; box.appendChild(g);
    list.sort(function (a, b) { return a.receivedDateTime < b.receivedDateTime ? 1 : -1; }).forEach(function (x) {
      var el = document.createElement("div"); el.className = "rel";
      var mm = document.createElement("div"); mm.className = "m";
      var from = (x.from && x.from.emailAddress) ? (x.from.emailAddress.name || x.from.emailAddress.address) : "";
      mm.textContent = fmtDate(x.receivedDateTime) + " · " + from;
      var s = document.createElement("div"); s.className = "s"; s.textContent = x.subject || "(geen onderwerp)";
      el.appendChild(mm); el.appendChild(s);
      el.onclick = function () {
        var ews = Office.context.mailbox.convertToEwsId(x.id, Office.MailboxEnums.RestVersion.v2_0);
        Office.context.mailbox.displayMessageForm(ews);
      };
      box.appendChild(el);
    });
  }

  // --- Start -----------------------------------------------------------------------
  // Pop-upvenster: terug van Microsoft met code of fout → doorgeven aan het paneel.
  if (/(code|error)=/.test(location.hash) || /[?&](code|error)=/.test(location.search)) { runPopupReturn(); return; }
  Office.onReady(function () {
    me = (Office.context.mailbox.userProfile && Office.context.mailbox.userProfile.displayName) || "";
    $("cats").addEventListener("click", function (e) {
      var c = e.target.getAttribute && e.target.getAttribute("data-c");
      if (c) toggleCat(c);   // nogmaals klikken = categorie weer verwijderen
    });
    $("deadline").addEventListener("change", function () { data.d = this.value; msg("Klik op Opslaan om de deadline vast te zetten."); });
    $("dtime").addEventListener("change", function () { data.t = this.value; msg("Klik op Opslaan om de deadline vast te zetten."); });
    $("saveDeadline").addEventListener("click", function () {
      data.d = $("deadline").value; data.t = $("dtime").value;
      if (!data.d) { msg("Vul eerst een datum in."); return; }
      addSys("Deadline " + fmtD(data.d) + " " + (data.t || "09:00") + (data.r.length ? ", herinnering " + data.r.map(remLabel).join(", ") + " vooraf" : ", zonder herinneringen"));
      save("Deadline opgeslagen", function () { syncFlag("Deadline opgeslagen: vlag gezet" + (data.r.length ? ", agenda bijgewerkt" : "")); syncCalendar(); });
    });
    $("clearDeadline").addEventListener("click", function () {
      if (!data.d && !data.r.length && !$("deadline").value) { msg("Er staat geen deadline."); return; }
      var hadRem = data.r.length;
      data.d = ""; data.t = ""; data.r = [];
      addSys("Deadline gewist" + (hadRem ? " (incl. " + hadRem + " herinnering" + (hadRem > 1 ? "en" : "") + ")" : ""));
      save("Deadline gewist", function () {
        syncFlag("Deadline gewist, vlag weg");
        // Agenda-items van deze mail opruimen (alleen als aangemeld)
        getToken(false).then(function (token) {
          return currentMessage(token).then(function (m) {
            return removeEvents(token, m).then(function (n) {
              if (n) { addSys("Uit agenda gehaald (" + n + " item" + (n !== 1 ? "s" : "") + ")"); save("Deadline gewist, " + n + " agenda-item(s) verwijderd"); }
              return calendarState(token, m);
            });
          });
        }).catch(function () {});
      });
    });
    $("owner").addEventListener("change", function () {
      data.v = this.value.trim(); rememberOwner(data.v); save("Verantwoordelijke opgeslagen");
    });
    $("addNote").addEventListener("click", function () {
      var t = $("newNote").value.trim(); if (!t) return;
      if (dlog && $("noteTarget").value === "dossier") {
        dlogAppend({ t: new Date().toISOString(), a: me, x: t, subj: (graphMsg && graphMsg.subject) || "" });
        $("newNote").value = ""; msg("Dossiernotitie toegevoegd"); return;
      }
      data.n.push({ t: new Date().toISOString(), a: me, x: t });
      $("newNote").value = ""; save("Notitie toegevoegd");
    });
    $("ckBtn").addEventListener("click", openCockpit);
    $("noneCk").addEventListener("click", function (e) { e.preventDefault(); openCockpit(); });
    $("ckClose").addEventListener("click", function () { $("ck").hidden = true; });
    $("ckSweep").addEventListener("click", ckSweep);
    Array.prototype.forEach.call(document.querySelectorAll(".ckp"), function (b) {
      b.addEventListener("click", function () {
        ckPrio = b.getAttribute("data-p");
        Array.prototype.forEach.call(document.querySelectorAll(".ckp"), function (x) { x.classList.toggle("on", x === b); });
        renderCkDos();
      });
    });
    $("dlogPrio").addEventListener("change", function () {
      if (!dlog) return;
      dlog.prio = this.value;
      dlogAppend({ t: new Date().toISOString(), a: me, x: "Prioriteit dossier: " + prioLabel(dlog.prio), k: "s", subj: (graphMsg && graphMsg.subject) || "" });
      if (data) { data.n.push({ t: new Date().toISOString(), a: me, x: "Prioriteit dossier '" + dlog.name + "': " + prioLabel(dlog.prio), k: "s" }); save("Prioriteit opgeslagen"); }
    });
    $("signIn").addEventListener("click", function () {
      $("authMsg").textContent = "Aanmelden…";
      getToken(true).then(function () { $("auth").hidden = true; graphRefresh(loadSeq); runFilter(); })
        .catch(function (e) { $("authMsg").textContent = "Aanmelden mislukt: " + (e.message || e); });
    });
    $("dossierBtn").addEventListener("click", openDossier);
    $("ovClose").addEventListener("click", function () { $("ov").hidden = true; });
    $("ovSearchBtn").addEventListener("click", ovSearch);
    $("ovSearch").addEventListener("keydown", function (e) { if (e.key === "Enter") ovSearch(); });
    $("ovSave").addEventListener("click", ovSave);
    loadOwners(); loadFilterSel();
    $("filterClear").addEventListener("click", function () { filterSel = []; saveFilterSel(); renderFilterCats(); runFilter(); });
    // Bij vastgezet (gepind) paneel: opnieuw laden als je een andere mail selecteert.
    if (Office.context.requirements.isSetSupported("Mailbox", "1.5")) {
      Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, load);
    }
    initAuth().then(load);
  });
})();
</script>
</body>
</html>
